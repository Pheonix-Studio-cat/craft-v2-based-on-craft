<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#87ceeb">
<meta name="description" content="Craft, a Minecraft clone in C, built to WebAssembly with touch controls, survival mode and creatures.">
<title>Craft</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2387ceeb'/%3E%3Crect y='9' width='16' height='7' fill='%236b4b2a'/%3E%3Crect y='9' width='16' height='2' fill='%235a9e3a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>

<!-- Everything below is filled in by ui.js once the game is running. -->
<div id="controls" class="hidden">
    <div id="hearts" class="row"></div>

    <div id="stick" class="control"><div id="knob"></div></div>

    <div id="actions">
        <div id="break" class="btn control" data-repeat="1">⛏<span class="label">BREAK</span></div>
        <div id="place" class="btn control" data-repeat="1">▣<span class="label">PLACE</span></div>
        <div id="jump" class="btn control">⤒<span class="label">JUMP</span></div>
    </div>

    <div id="top-right">
        <div id="fly" class="btn small control">✈</div>
        <div id="bag" class="btn small control">🎒</div>
        <div id="menu-button" class="btn small control">☰</div>
    </div>

    <div id="hotbar" class="control"></div>
</div>

<div id="modal" class="hidden">
    <div id="panel"></div>
</div>

<div id="loading">
    <h1>CRAFT</h1>
    <div id="bar"><div></div></div>
    <div id="status">loading…</div>
</div>

<script src="ui.js"></script>
<script>
var Module = window.Module = CraftUI.moduleConfig();
</script>

{{{ SCRIPT }}}

</body>
</html>
